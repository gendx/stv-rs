[package]
name = "stv-rs"
description = "Single Transferable Vote implementation in Rust"
version = "0.5.1"
authors = ["Guillaume Endignoux <guillaumee@google.com>"]
license = "Apache-2.0"
repository = "https://github.com/gendx/stv-rs"
readme = "README.md"
categories = ["command-line-utilities", "mathematics"]
keywords = ["voting", "election", "stv", "meek"]
exclude = ["man/*", "testdata/*", "tools/*", ".github/*"]
edition = "2024"
rust-version = "1.91.0"

[package.metadata.docs.rs]
features = ["checked_i64", "log_parallelism"]
rustdoc-args = ["--document-private-items", "--generate-link-to-definition"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
num = "0.4.3"
rayon = "1.12.0"
regex = "1.13.1"
smart-big-rational = "0.3.1"

# Platforms that support `libc::sched_setaffinity()`.
[target.'cfg(any(target_os = "android", target_os = "dragonfly", target_os = "freebsd", target_os = "linux"))'.dependencies]
nix = { version = "0.32.0", features = ["sched"] }

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3.1"
rand_distr = "0.4"

[features]
default = ["checked_i64"]
checked_i64 = []
log_parallelism = []
